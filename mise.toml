[tools]
gh = "latest"
git-cliff = "latest"
jactionlint = "latest"
release-plz = "latest"
shellcheck = "latest"
rust = { version = "1.88", components = ["clippy", "rustfmt"] } # the MSRV

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.format]
description = "Fix formatting issues"
run = "cargo fmt"

[tasks.lint]
description = "Fix linting issues"
run = "cargo clippy --all-targets --fix --allow-dirty"

[tasks.check]
description = "Check formatting/linting/tests"
run = [
  # Fail if the pinned toolchain has drifted from rust-version in Cargo.toml
  'grep -q "^rust-version = \"$(rustc -V | cut -d" " -f2 | cut -d. -f1,2)\"" Cargo.toml',
  "cargo fmt --check",
  "cargo clippy --all-targets",
  "cargo test"
]

[tasks.changelog]
description = "Update changelog"
shell = "bash -c"
run = [
  # Skip commits off HEAD's first-parent chain (branch and upstream commits), so
  # run this on main. Keep in sync with the release-pr job in release.yml.
  "comm -23 <(git rev-list HEAD | sort) <(git rev-list --first-parent HEAD | sort) > .cliffignore",
  "git cliff --bump"
]

[tasks.release]
description = "Update release versions and changelogs locally"
run = "release-plz update"
