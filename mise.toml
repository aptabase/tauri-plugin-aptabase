[tools]
gh = "latest"
git-cliff = "latest"
jactionlint = "latest"
mr-boxington = "latest"
release-plz = "latest"
shellcheck = "latest"
rust = { version = "1.88", components = ["clippy", "rustfmt"], mr_boxington = true } # the MSRV

[tasks.build]
description = "Build project"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.format]
description = "Fix formatting issues"
run = "cargo fmt"

[tasks.lint]
description = "Fix linting issues"
run = "cargo clippy --all-targets --fix --allow-dirty"

[tasks.check]
description = "Check formatting, linting, and tests"
depends = ["check:toolchain", "check:workflows"]
run = ["cargo fmt --check", "cargo clippy --all-targets", "cargo test"]

[tasks."check:toolchain"]
hide = true
description = "Fail if the pinned toolchain has drifted from rust-version in Cargo.toml"
run = 'grep -q "^rust-version = \"$(rustc -V | cut -d" " -f2 | cut -d. -f1,2)\"" Cargo.toml'

[tasks."check:workflows"]
hide = true
description = "Check GitHub Actions workflows"
run = "jactionlint"

[tasks."example:build"]
description = "Build example project"
depends = ["example:copy-env"]
dir = "examples/helloworld"
run = "cargo build"

[tasks."example:format"]
description = "Fix formatting issues in example"
dir = "examples/helloworld"
run = "cargo fmt"

[tasks."example:lint"]
description = "Fix linting issues in example"
depends = ["example:copy-env"]
dir = "examples/helloworld"
run = "cargo clippy --all-targets --fix --allow-dirty"

[tasks."example:check"]
description = "Check formatting and linting in example"
depends = ["example:copy-env"]
dir = "examples/helloworld"
run = ["cargo fmt --check", "cargo clippy --all-targets"]

[tasks."example:copy-env"]
hide = true
description = "Ensure .env is available at compile time"
dir = "examples/helloworld"
run = "test -f .env || cp .env.example .env"

[tasks."release:prepare"]
description = "Update CHANGELOG.md and Cargo.toml to the next version"
shell = "bash -c"
run = [
  # Ignore commits off HEAD's first-parent chain (branch and upstream commits)
  "comm -23 <(git rev-list HEAD | sort) <(git rev-list --first-parent HEAD | sort) > .cliffignore",
  "git cliff --bump -o CHANGELOG.md",
  'version=$(git cliff --bumped-version) && release-plz set-version "${version#v}"',
]
