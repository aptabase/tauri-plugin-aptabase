[package]
name = "aptabase-rs"
version = "0.3.1"
license = "MIT"
description = "Rust SDK for Aptabase: Open Source, Privacy-First and Simple Analytics for Mobile, Desktop and Web Apps"
authors = ["Eugén Cowie"]
edition = "2021"
rust-version = "1.88"
homepage = "https://github.com/eugencowie/aptabase-rs"
repository = "https://github.com/eugencowie/aptabase-rs"
keywords = ["analytics", "aptabase", "telemetry"]
categories = ["api-bindings"]

[dependencies]
tokio = { version = "1.43.0", features = ["rt", "time"] }
futures = "0.3.31"
serde = "1.0.217"
serde_json = "1.0.138"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "charset", "http2", "system-proxy"] }
time = { version = "0.3.37", features = ["formatting"] }
os_info = "3.9.2"
rand = "0.10.0"
log = "0.4.25"
sys-locale = "0.3.2"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
time = { version = "0.3.37", features = ["parsing"] }
wiremock = "0.6.5"

[features]
default = ["default-tls"]
default-tls = ["reqwest/default-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
to_string_in_format_args = "allow" # match upstream
uninlined_format_args = "allow" # match upstream
