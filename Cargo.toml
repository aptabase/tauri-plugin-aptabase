[package]
name = "tauri-plugin-aptabase"
version = "1.2.0"
license = "MIT"
description = "Tauri Plugin for Aptabase: Open Source, Privacy-First and Simple Analytics for Mobile, Desktop and Web Apps"
authors = ["Guilherme Oenning"]
edition = "2021"
rust-version = "1.85.0"
readme = "README.md"
repository = "https://github.com/aptabase/tauri-plugin-aptabase"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-aptabase"

[dependencies]
tauri = "2.11.5"
tokio = "1.53.1"
futures = "0.3.31"
serde = "1.0.229"
serde_json = "1.0.151"
# Only reqwest's TLS default is turned off (see the TLS features below); its other defaults stay on.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "charset", "http2", "system-proxy"] }
time = { version = "0.3.41", features = ["formatting"] }
os_info = "3.12.0"
rand = "0.10.0"
log = "0.4.27"
sys-locale = "0.3.2"

[dev-dependencies]
time = { version = "0.3.41", features = ["parsing"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[features]
default = ["default-tls"]
default-tls = ["reqwest/default-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]
