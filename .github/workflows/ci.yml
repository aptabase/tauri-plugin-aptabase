name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      # Stop `mise run` installing tools beyond what mise-action installed
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with: { install_args: rust }
      - uses: Swatinem/rust-cache@v2
      - run: mise run check

  check-example:
    name: Check example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/helloworld
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with: { install_args: rust }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: examples/helloworld }
      - run: cp .env.example .env
      - run: cargo clippy --all-targets
