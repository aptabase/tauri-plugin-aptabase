name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Build JS
        run: npm run build

      - name: Check Rust
        run: cargo check

      - name: Test Rust
        run: cargo test

      # The rustls backends exist so apps can build for Linux and Android without OpenSSL (#34).
      - name: Check rustls builds don't pull in OpenSSL
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-linux-android; do
            for features in "" "--no-default-features --features rustls-tls"; do
              if cargo tree -e normal --target "$target" $features --prefix none | grep -E '^(openssl-sys|native-tls) '; then
                echo "::error::OpenSSL in the dependency tree for $target ${features:-(default features)}"
                exit 1
              fi
            done
          done